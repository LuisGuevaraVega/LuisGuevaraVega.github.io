{% assign herramientas = "python:Python,r:R,stata:Stata,sql:SQL,power-bi:Power BI,looker-studio:Looker Studio,power-automate:Power Automate,claude-code:Claude Code,git:Git,github:GitHub" | split: "," %}
<ul class="herramientas" aria-label="Herramientas / Tools">
  {% for h in herramientas %}{% assign par = h | split: ":" %}
  <li title="{{ par[1] }}"><img src="{{ site.baseurl }}/images/logos/{{ par[0] }}.svg" alt="{{ par[1] }}" width="34" height="34" loading="lazy"></li>
  {% endfor %}
</ul>
