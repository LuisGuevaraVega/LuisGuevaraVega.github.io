---
layout: default
---

{% include base_path %}

<main id="contenido" class="ancho" role="main">
  <header class="ancho__cabeza">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1 class="ancho__titulo">{{ page.title }}</h1>
    {% if page.bajada %}<p class="ancho__bajada">{{ page.bajada }}</p>{% endif %}
  </header>
  <div class="ancho__contenido">
    {{ content }}
  </div>
</main>
